version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # The lemma release is pinned exactly to match `Tarski/Lemma.lean`'s
    # `version`; the two move together by hand.
    ignore:
      - dependency-name: "@lakatos/lemma"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
